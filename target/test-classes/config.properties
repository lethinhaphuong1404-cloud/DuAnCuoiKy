
# Website cần kiểm thử
base.url=https://demo1.cybersoft.edu.vn/

# Trình duyệt: chrome
browser=chrome

# Chạy ẩn trình duyệt: true hoặc false
headless=false

# Thời gian chờ tối đa (giây)
explicit.wait=10
page.load.timeout=30

# Thư mục kết quả nằm trong project
report.path=target/extent-report
screenshot.path=target/screenshots
log.path=target/logs

# Để trống nếu chưa xác định được URL chọn ghế
seat.selection.url=

# Để trống nếu chưa xác định URL lịch sử đặt vé
booking.history.url=
